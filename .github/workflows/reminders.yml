name: Send office reminders

on:
  schedule:
    # Hourly; the script decides per user's timezone what (if anything) is due.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      send_test:
        description: Send a one-off test email to every user with reminders on
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run reminders
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REMINDER_FROM_EMAIL: ${{ vars.REMINDER_FROM_EMAIL }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SEND_TEST_EMAIL: ${{ inputs.send_test }}
